<!-- ViewBox matches DB bounds: 0 0 2000 1400 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400" width="2000" height="1400">
  <defs>
    <!-- Elevator icon symbol -->
    <symbol id="icon-elevator" viewBox="0 0 40 40">
      <rect x="2" y="2" width="36" height="36" rx="4" fill="none" stroke="#2D2D2D" stroke-width="2"/>
      <line x1="20" y1="6" x2="20" y2="34" stroke="#2D2D2D" stroke-width="1.5"/>
      <polygon points="12,20 16,14 16,20" fill="#2D2D2D"/>
      <polygon points="12,22 16,28 16,22" fill="#2D2D2D"/>
      <polygon points="28,20 24,14 24,20" fill="#2D2D2D"/>
      <polygon points="28,22 24,28 24,22" fill="#2D2D2D"/>
    </symbol>
    <!-- Stairs icon symbol -->
    <symbol id="icon-stairs" viewBox="0 0 40 40">
      <rect x="2" y="2" width="36" height="36" rx="4" fill="none" stroke="#2D2D2D" stroke-width="2"/>
      <polyline points="8,32 8,24 16,24 16,16 24,16 24,8 32,8" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- Entrance icon symbol -->
    <symbol id="icon-entrance" viewBox="0 0 40 40">
      <rect x="2" y="2" width="36" height="36" rx="4" fill="none" stroke="#2D2D2D" stroke-width="2"/>
      <path d="M14,8 L14,32 L28,32 L28,8 Z" fill="none" stroke="#2D2D2D" stroke-width="2"/>
      <circle cx="25" cy="20" r="2" fill="#2D2D2D"/>
      <polygon points="8,20 14,16 14,24" fill="#2D2D2D"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="2000" height="1400" fill="#FAFAFA"/>

  <!-- ===== BUILDING SHELL (outer walls) ===== -->
  <path d="
    M 100,70
    L 100,1330
    L 1900,1330
    L 1900,70
    L 100,70
    Z"
    fill="none" stroke="#2D2D2D" stroke-width="4" stroke-linejoin="round"/>

  <!-- ===== CORRIDORS ===== -->
  <!-- Spine corridor (East-West) -->
  <rect x="100" y="595" width="1800" height="140" fill="#E8E8E8"/>
  
  <!-- West vertical corridor -->
  <rect x="560" y="70" width="200" height="1260" fill="#E8E8E8"/>
  
  <!-- Center vertical corridor -->
  <rect x="945" y="70" width="200" height="1260" fill="#E8E8E8"/>
  
  <!-- East vertical corridor -->
  <rect x="1330" y="70" width="200" height="1260" fill="#E8E8E8"/>

  <!-- ===== ROOMS ===== -->
  <!-- Floor 2 Lobby -->
  <rect x="100" y="578" width="233" height="245" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="217" y="709" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#333">Floor 2 Lobby</text>

  <!-- Meeting Room B1 -->
  <rect x="417" y="70" width="433" height="245" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="633" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#333">Meeting Room B1</text>

  <!-- Meeting Room B2 -->
  <rect x="1150" y="70" width="433" height="245" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="1367" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#333">Meeting Room B2</text>

  <!-- Break Room -->
  <rect x="417" y="1085" width="433" height="263" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="633" y="1223" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#333">Break Room</text>

  <!-- Lounge Area -->
  <rect x="1150" y="1085" width="433" height="263" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="1367" y="1223" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#333">Lounge Area</text>

  <!-- Executive Office -->
  <rect x="1600" y="525" width="367" height="350" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="1783" y="709" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#333">Executive Office</text>

  <!-- Elevator Bank -->
  <rect x="1067" y="630" width="167" height="140" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="1150" y="709" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#333">Elevator Bank</text>

  <!-- Stairwell A -->
  <rect x="767" y="630" width="167" height="140" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="850" y="709" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#333">Stairwell A</text>

  <!-- ===== ICONS ===== -->
  <!-- node 108 - Elevator Bank at (1150,700) -->
  <use href="#icon-elevator" x="1130" y="660" width="40" height="40"/>

  <!-- node 114 - Stairwell A at (850,700) -->
  <use href="#icon-stairs" x="830" y="660" width="40" height="40"/>

  <!-- node 101 - Floor 2 Lobby at (200,700) -->
  <use href="#icon-entrance" x="160" y="660" width="40" height="40"/>
</svg>