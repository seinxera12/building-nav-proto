<!-- Coordinate system: pixel, Y increases downward (same as HTML canvas) -->
<!-- ViewBox matches DB bounds: 0 0 2000 1400 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400" width="2000" height="1400">
  <defs>
    <!-- Elevator icon symbol -->
    <symbol id="icon-elevator" viewBox="0 0 40 40">
      <rect x="2" y="2" width="36" height="36" rx="4" fill="none" stroke="#2D2D2D" stroke-width="2"/>
      <line x1="20" y1="6" x2="20" y2="34" stroke="#2D2D2D" stroke-width="1.5"/>
      <polygon points="12,20 16,14 16,20" fill="#2D2D2D"/>
      <polygon points="12,22 16,28 16,22" fill="#2D2D2D"/>
      <polygon points="28,20 24,14 24,20" fill="#2D2D2D"/>
      <polygon points="28,22 24,28 24,22" fill="#2D2D2D"/>
    </symbol>
    <!-- Stairs icon symbol -->
    <symbol id="icon-stairs" viewBox="0 0 40 40">
      <rect x="2" y="2" width="36" height="36" rx="4" fill="none" stroke="#2D2D2D" stroke-width="2"/>
      <polyline points="8,32 8,24 16,24 16,16 24,16 24,8 32,8" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- Entrance icon symbol -->
    <symbol id="icon-entrance" viewBox="0 0 40 40">
      <rect x="2" y="2" width="36" height="36" rx="4" fill="none" stroke="#2D2D2D" stroke-width="2"/>
      <path d="M14,8 L14,32 L28,32 L28,8 Z" fill="none" stroke="#2D2D2D" stroke-width="2"/>
      <circle cx="25" cy="20" r="2" fill="#2D2D2D"/>
      <polygon points="8,20 14,16 14,24" fill="#2D2D2D"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="2000" height="1400" fill="#FAFAFA"/>

  <!-- ===== BUILDING SHELL (outer walls) ===== -->
  <path d="
    M 80,120
    L 80,1280
    L 120,1320
    L 1920,1320
    L 1960,1280
    L 1960,120
    L 1920,80
    L 80,80
    L 80,120
    Z"
    fill="none" stroke="#2D2D2D" stroke-width="4" stroke-linejoin="round"/>

  <!-- ===== CORRIDORS ===== -->
  <!-- Main spine corridor (East-West) -->
  <rect x="100" y="640" width="1800" height="120" fill="#E8E8E8"/>
  
  <!-- West vertical corridor -->
  <rect x="540" y="200" width="120" height="1100" fill="#E8E8E8"/>
  
  <!-- Center vertical corridor -->
  <rect x="940" y="200" width="120" height="1100" fill="#E8E8E8"/>
  
  <!-- East vertical corridor -->
  <rect x="1340" y="200" width="120" height="1100" fill="#E8E8E8"/>

  <!-- ===== ROOMS ===== -->
  <!-- Main Lobby -->
  <rect x="880" y="1150" width="240" height="170" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="1000" y="1240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">Main Lobby</text>

  <!-- Conference Room A -->
  <rect x="460" y="120" width="280" height="210" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="600" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">Conference Room A</text>

  <!-- Office Suite 201 -->
  <rect x="860" y="120" width="280" height="210" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="1000" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">Office Suite 201</text>

  <!-- Restroom -->
  <rect x="460" y="1040" width="280" height="220" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="600" y="1155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">Restroom</text>

  <!-- Cafeteria -->
  <rect x="1240" y="1040" width="320" height="220" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="1400" y="1155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">Cafeteria</text>

  <!-- IT Department -->
  <rect x="1580" y="580" width="280" height="240" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="1720" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">IT Department</text>

  <!-- Elevator Bank -->
  <rect x="1100" y="640" width="100" height="120" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="1150" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">Elevator Bank</text>

  <!-- Stairwell A -->
  <rect x="790" y="640" width="120" height="120" rx="4" fill="#D4D4D4" stroke="#888888" stroke-width="2"/>
  <text x="850" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">Stairwell A</text>

  <!-- ===== ICONS ===== -->
  <!-- node 8 - Elevator Bank at (1150,700) -->
  <use href="#icon-elevator" x="1130" y="680" width="40" height="40"/>

  <!-- node 14 - Stairwell A at (850,700) -->
  <use href="#icon-stairs" x="830" y="680" width="40" height="40"/>

  <!-- node 1 - Main Lobby entrance at (1000,1250) -->
  <use href="#icon-entrance" x="980" y="1230" width="40" height="40"/>
</svg>