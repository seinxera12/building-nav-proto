<!-- ============================================================================
     floor-2-new.svg — Realistic mixed-use MALL floor plan (Upper / Level 2)
     Coordinate system: pixel, Y increases downward (HTML/Leaflet canvas).
     ViewBox matches DB bounds: 0 0 2000 1400.

     STACKED CORES: escalators, elevators, both stairs and the restroom block
     occupy the SAME (x,y) as Level 1 so inter-floor connectors (escalator /
     elevator / stairs edges with floor_change:true) are physically aligned.
     The atrium is an OPEN BALCONY VOID looking down to Level 1.
     Circulation = ring + radial spurs + a branched service loop on the west wing.
     ============================================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400" width="2000" height="1400">
  <defs>
    <pattern id="concourse2" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="#EAEEF0"/>
      <path d="M56 0 H0 V56" fill="none" stroke="#D9DEE2" stroke-width="1"/>
    </pattern>
    <pattern id="wetHatch2" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#E7EEF2"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#BFD0DA" stroke-width="1.2"/>
    </pattern>
    <pattern id="cinemaFloor" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#2B2F3A"/>
      <path d="M40 0 H0 V40" fill="none" stroke="#3A3F4D" stroke-width="1"/>
    </pattern>

    <symbol id="icon-elevator" viewBox="0 0 40 40">
      <rect x="2" y="2" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
      <line x1="20" y1="6" x2="20" y2="34" stroke="#2D2D2D" stroke-width="1.5"/>
      <polygon points="12,20 16,14 16,20" fill="#2D2D2D"/><polygon points="12,22 16,28 16,22" fill="#2D2D2D"/>
      <polygon points="28,20 24,14 24,20" fill="#2D2D2D"/><polygon points="28,22 24,28 24,22" fill="#2D2D2D"/>
    </symbol>
    <symbol id="icon-stairs" viewBox="0 0 40 40">
      <rect x="2" y="2" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
      <polyline points="8,32 8,24 16,24 16,16 24,16 24,8 32,8" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-escalator" viewBox="0 0 60 40">
      <rect x="2" y="2" width="56" height="36" rx="4" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
      <line x1="8" y1="32" x2="52" y2="8" stroke="#2D2D2D" stroke-width="2.5"/>
      <polygon points="44,12 52,8 48,17" fill="#2D2D2D"/>
      <line x1="8" y1="32" x2="20" y2="32" stroke="#2D2D2D" stroke-width="2.5"/>
    </symbol>
    <symbol id="icon-info" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="17" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
      <circle cx="20" cy="12" r="2.6" fill="#2D2D2D"/><rect x="18" y="17" width="4" height="14" fill="#2D2D2D"/>
    </symbol>
  </defs>

  <!-- ============================ SITE / SLAB ============================ -->
  <rect width="2000" height="1400" fill="#D2D8DC"/>

  <!-- ===================== BUILDING SHELL (same chamfered footprint) ===================== -->
  <path d="M 60,260 L 260,60 L 1740,60 L 1940,260 L 1940,1140 L 1740,1340 L 260,1340 L 60,1140 Z"
        fill="#FFFFFF" stroke="#2D2D2D" stroke-width="9" stroke-linejoin="round"/>
  <path d="M 84,272 L 272,84 L 1728,84 L 1916,272 L 1916,1128 L 1728,1316 L 272,1316 L 84,1128 Z"
        fill="#EEF1F3" stroke="#6B7077" stroke-width="2" stroke-linejoin="round"/>

  <!-- structural column grid (same grid as L1) -->
  <g fill="#C7CDD3" stroke="#8A9097" stroke-width="1.5">
    <rect x="392" y="392" width="18" height="18"/><rect x="792" y="312" width="18" height="18"/>
    <rect x="1192" y="312" width="18" height="18"/><rect x="1592" y="392" width="18" height="18"/>
    <rect x="392" y="982" width="18" height="18"/><rect x="792" y="1062" width="18" height="18"/>
    <rect x="1192" y="1062" width="18" height="18"/><rect x="1592" y="982" width="18" height="18"/>
    <rect x="592" y="692" width="18" height="18"/><rect x="1392" y="692" width="18" height="18"/>
  </g>

  <!-- ============================ CIRCULATION ============================ -->
  <!-- RING concourse around the balcony void -->
  <path d="M 360,360 H 1640 A 60,60 0 0 1 1700,420 V 980 A 60,60 0 0 1 1640,1040 H 360 A 60,60 0 0 1 300,980 V 420 A 60,60 0 0 1 360,360 Z"
        fill="url(#concourse2)" stroke="#C3CACF" stroke-width="2"/>
  <!-- Radial spurs -->
  <rect x="940" y="84"  width="120" height="300" fill="url(#concourse2)" stroke="#C3CACF" stroke-width="2"/>
  <rect x="940" y="1016" width="120" height="300" fill="url(#concourse2)" stroke="#C3CACF" stroke-width="2"/>
  <rect x="1640" y="640" width="276" height="120" fill="url(#concourse2)" stroke="#C3CACF" stroke-width="2"/>
  <rect x="84"   y="640" width="276" height="120" fill="url(#concourse2)" stroke="#C3CACF" stroke-width="2"/>
  <!-- BRANCHED service loop on the west wing (dead-end spurs → richer routing) -->
  <rect x="180" y="420" width="64" height="160" fill="url(#concourse2)" stroke="#C3CACF" stroke-width="2"/>
  <rect x="180" y="820" width="64" height="160" fill="url(#concourse2)" stroke="#C3CACF" stroke-width="2"/>

  <!-- ===== BALCONY VOID (open to Level 1 atrium below) ===== -->
  <ellipse cx="1000" cy="700" rx="300" ry="220" fill="#CBCFD4" stroke="#8A9097" stroke-width="4"/>
  <ellipse cx="1000" cy="700" rx="262" ry="186" fill="#B9BEC4" stroke="#8A9097" stroke-width="2"/>
  <!-- balcony guard rail -->
  <ellipse cx="1000" cy="700" rx="298" ry="218" fill="none" stroke="#5B6770" stroke-width="3"/>
  <ellipse cx="1000" cy="700" rx="276" ry="198" fill="none" stroke="#9AA4AD" stroke-width="2" stroke-dasharray="3 6"/>
  <text x="1000" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#6B7077">OPEN TO BELOW</text>
  <text x="1000" y="714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7B8690">(Atrium void)</text>

  <!-- ===== STACKED VERTICAL CORES (identical positions to L1) ===== -->
  <!-- Escalators (north of void) -->
  <g>
    <rect x="900" y="404" width="200" height="92" fill="#EDEFF1" stroke="#2D2D2D" stroke-width="4"/>
    <line x1="1000" y1="404" x2="1000" y2="496" stroke="#9AA4AD" stroke-width="2"/>
    <use href="#icon-escalator" x="912" y="426" width="76" height="50"/>
    <use href="#icon-escalator" x="1012" y="426" width="76" height="50" transform="scale(-1,1) translate(-2088,0)"/>
    <text x="1000" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#37424A">Escalators ↑↓</text>
  </g>
  <!-- Elevators (south of void) -->
  <g>
    <rect x="930" y="906" width="140" height="92" fill="#EDEFF1" stroke="#2D2D2D" stroke-width="4"/>
    <line x1="1000" y1="906" x2="1000" y2="998" stroke="#9AA4AD" stroke-width="2"/>
    <use href="#icon-elevator" x="942" y="926" width="46" height="46"/>
    <use href="#icon-elevator" x="1012" y="926" width="46" height="46"/>
    <text x="1000" y="900" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#37424A">Elevators</text>
  </g>
  <!-- Stair NW -->
  <g>
    <rect x="312" y="372" width="96" height="96" fill="#EDEFF1" stroke="#2D2D2D" stroke-width="4"/>
    <use href="#icon-stairs" x="336" y="396" width="48" height="48"/>
    <text x="360" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#37424A">Stair NW</text>
  </g>
  <!-- Stair SE -->
  <g>
    <rect x="1592" y="932" width="96" height="96" fill="#EDEFF1" stroke="#2D2D2D" stroke-width="4"/>
    <use href="#icon-stairs" x="1616" y="956" width="48" height="48"/>
    <text x="1640" y="928" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#37424A">Stair SE</text>
  </g>
  <!-- Restroom block (stacked) -->
  <g>
    <rect x="1340" y="372" width="300" height="120" fill="url(#wetHatch2)" stroke="#2D2D2D" stroke-width="4"/>
    <line x1="1490" y1="372" x2="1490" y2="492" stroke="#9AA4AD" stroke-width="2"/>
    <g fill="#FFFFFF" stroke="#8FA0AA" stroke-width="1.3">
      <rect x="1356" y="388" width="38" height="26"/><rect x="1356" y="420" width="38" height="26"/><rect x="1356" y="452" width="38" height="26"/>
      <rect x="1602" y="388" width="38" height="26"/><rect x="1602" y="420" width="38" height="26"/>
    </g>
    <text x="1420" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#37424A">Restrooms</text>
  </g>

  <!-- ============================ TENANTS (Upper floor) ============================ -->

  <!-- ANCHOR: CINEMA / MULTIPLEX (whole NW corner — dark auditorium fill) -->
  <path d="M 96,284 L 280,96 L 720,96 L 720,348 L 360,348 A 60,60 0 0 0 312,372 L 96,372 Z"
        fill="url(#cinemaFloor)" stroke="#2D2D2D" stroke-width="5" stroke-linejoin="round"/>
  <!-- individual auditoria with raked seating hint -->
  <g fill="none" stroke="#54596B" stroke-width="1.5">
    <rect x="140" y="150" width="160" height="80"/><rect x="320" y="150" width="160" height="80"/><rect x="500" y="150" width="160" height="80"/>
    <rect x="140" y="250" width="240" height="80"/><rect x="400" y="250" width="260" height="80"/>
  </g>
  <g stroke="#6E7488" stroke-width="1">
    <line x1="150" y1="170" x2="290" y2="170"/><line x1="150" y1="185" x2="290" y2="185"/><line x1="150" y1="200" x2="290" y2="200"/>
    <line x1="330" y1="170" x2="470" y2="170"/><line x1="330" y1="185" x2="470" y2="185"/><line x1="330" y1="200" x2="470" y2="200"/>
    <line x1="510" y1="170" x2="650" y2="170"/><line x1="510" y1="185" x2="650" y2="185"/>
  </g>
  <text x="400" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#E8C77B">STARPLEX CINEMAS</text>
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#B9A06A">8 Screens · Anchor</text>

  <!-- North spur: gaming + bookstore (angled fronts) -->
  <g stroke="#2D2D2D" stroke-width="4" fill="#F8F9FA">
    <path d="M 740,96 L 920,96 L 920,300 L 780,300 L 740,260 Z"/>
    <path d="M 1080,96 L 1300,96 L 1300,260 L 1260,300 L 1080,300 Z"/>
  </g>
  <text x="828" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#37424A">Arcade</text>
  <text x="1190" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#37424A">Bookstore</text>

  <!-- NE: fashion boutiques (curved storefront frontage) -->
  <path d="M 1320,96 L 1720,96 L 1908,284 L 1908,360 L 1340,360 Q 1330,230 1320,96 Z"
        fill="#F8F9FA" stroke="#2D2D2D" stroke-width="4"/>
  <line x1="1520" y1="100" x2="1520" y2="320" stroke="#9AA4AD" stroke-width="2"/>
  <line x1="1700" y1="130" x2="1700" y2="300" stroke="#9AA4AD" stroke-width="2"/>
  <text x="1420" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#37424A">Boutique</text>
  <text x="1610" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#37424A">Footwear</text>
  <text x="1790" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#37424A">Watches</text>

  <!-- ANCHOR: GYM / FITNESS (east wing, double unit) -->
  <g stroke="#2D2D2D" stroke-width="5" fill="#EFF4F1">
    <rect x="1720" y="500" width="188" height="160"/>
    <rect x="1720" y="780" width="188" height="180"/>
  </g>
  <g fill="#CFE0D6" stroke="#8FB39C" stroke-width="1.3">
    <rect x="1740" y="520" width="40" height="24"/><rect x="1790" y="520" width="40" height="24"/><rect x="1840" y="520" width="40" height="24"/>
    <rect x="1740" y="556" width="40" height="24"/><rect x="1790" y="556" width="40" height="24"/>
  </g>
  <text x="1814" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#37424A">FitZone Gym</text>
  <text x="1814" y="875" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#37424A">Spa &amp; Salon</text>

  <!-- West wing: services off the branched service loop (with dead-ends) -->
  <g stroke="#2D2D2D" stroke-width="4" fill="#F8F9FA">
    <rect x="92" y="420" width="84" height="160"/>
    <rect x="248" y="420" width="60" height="160"/>
    <rect x="92" y="820" width="84" height="160"/>
    <rect x="248" y="820" width="60" height="160"/>
  </g>
  <text x="134" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#37424A" transform="rotate(-90 134 505)">Mgmt Office</text>
  <text x="278" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#37424A" transform="rotate(-90 278 505)">Store</text>
  <text x="134" y="905" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#37424A" transform="rotate(-90 134 905)">Kids Play</text>
  <text x="278" y="905" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#37424A" transform="rotate(-90 278 905)">WC</text>

  <!-- South band: RESTAURANTS (sit-down, varied footprints + terraces) -->
  <path d="M 312,1040 H 1640 A 60,60 0 0 0 1700,980 V 1128 L 1512,1316 L 1060,1316 L 1060,1040 Z"
        fill="#F7F1E8" stroke="#2D2D2D" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 300,980 V 1128 L 488,1316 L 940,1316 L 940,1040 H 360 A 60,60 0 0 1 312,1040 Z"
        fill="#F7F1E8" stroke="#2D2D2D" stroke-width="5" stroke-linejoin="round"/>
  <!-- lease divisions -->
  <g stroke="#9AA4AD" stroke-width="2">
    <line x1="620" y1="1040" x2="620" y2="1316"/>
    <line x1="780" y1="1040" x2="700" y2="1316"/>
    <line x1="1180" y1="1040" x2="1180" y2="1316"/>
    <line x1="1380" y1="1040" x2="1440" y2="1316"/>
  </g>
  <!-- restaurant tables -->
  <g fill="#E6D8C3" stroke="#B79B73" stroke-width="1.3">
    <rect x="420" y="1110" width="44" height="44" rx="4"/><rect x="500" y="1180" width="44" height="44" rx="4"/>
    <rect x="680" y="1110" width="44" height="44" rx="4"/><circle cx="900" cy="1160" r="24"/>
    <rect x="1240" y="1110" width="44" height="44" rx="4"/><circle cx="1320" cy="1200" r="24"/>
    <rect x="1500" y="1130" width="44" height="44" rx="4"/>
  </g>
  <text x="500" y="1090" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#9C7E4F">Trattoria</text>
  <text x="850" y="1090" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#9C7E4F">Sushi Bar</text>
  <text x="1290" y="1090" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#9C7E4F">Grill House</text>
  <text x="1520" y="1090" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#9C7E4F">Café</text>

  <!-- ===== balcony connector bridge across the void (extra route) ===== -->
  <rect x="660" y="676" width="160" height="48" fill="url(#concourse2)" stroke="#9AA4AD" stroke-width="2"/>
  <rect x="1180" y="676" width="160" height="48" fill="url(#concourse2)" stroke="#9AA4AD" stroke-width="2"/>
  <text x="740" y="668" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7B8690">Sky Bridge</text>
  <text x="1260" y="668" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7B8690">Sky Bridge</text>

  <!-- Info kiosk -->
  <use href="#icon-info" x="836" y="880" width="34" height="34"/>

  <!-- ===== floor badge ===== -->
  <g>
    <rect x="120" y="1230" width="170" height="56" rx="8" fill="#37424A"/>
    <text x="205" y="1267" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">LEVEL 2 · UF</text>
  </g>
</svg>
