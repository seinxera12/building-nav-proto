services:
  db:
    image: postgis/postgis:15-3.3
    container_name: building_nav_db
    environment:
      POSTGRES_DB: indoornav
      POSTGRES_USER: nav
      POSTGRES_PASSWORD: nav123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nav -d indoornav"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: buildingnav_api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app        # hot reload — code changes reflect immediately
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
